<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festivite</title>
    <link rel="stylesheet" href="styles/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Leckerli+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id=app>
        <aside>
            <img src="assets/icons/Logo.svg" alt="ícone de lança confete">
            <h1>Festivite</h1>
            <p>Crie um convite digital para o seu evento</p>
        </aside>

        <main>
            <div id="main-container">
                <h2>Crie seu convite</h2>
                <form method="post" enctype="multipart/form-data">
                    <fieldset class="about-event">
                        <div class="legend">
                            <img src="assets/icons/calendar.svg" alt="ícone de calendário">
                            <legend>Sobre o evento</legend>
                        </div>

                        <div class="input-wrapper">
                            <label for="event-name">Título</label>
                            <input 
                                id="event-name"
                                name="event-name"
                                type="text"
                                placeholder="Nome do evento"
                            >
                        </div>

                        <div class="grid">
                            <div class="input-wrapper">
                                <label for="event-begin">Início</label>
                                <input 
                                    id="event-begin"
                                    name="event-begin"
                                    type="datetime-local"
                                >
                            </div>

                            <div class="input-wrapper">
                                <label for="event-end">Fim</label>
                                <input 
                                    id="event-end"
                                    name="event-end"
                                    type="datetime-local"
                                >
                            </div>

                            <div>
                                <label>Tipo</label>

                                <div class="type-wrapper">
                                    <div class="type-inner">
                                        <div class="in-person-image"></div>
                                        <input 
                                        id="in-person"
                                        name="type"
                                        value="in-person"
                                        type="radio"
                                        checked
                                        >
                                        <label for="in-person">Presencial</label>
                                    </div>

                                    <div class="type-inner">
                                        <div class="remote-image"></div>
                                        <input 
                                        id="remote"
                                        name="type"
                                        value="remote"
                                        type="radio"
                                        >
                                        <label for="remote">Remoto</label>
                                    </div>
                                </div>
                            </div>

                            <div class="input-wrapper">
                                <label for="local">Local</label>
                                <input 
                                    id="local"
                                    name="local"
                                    type="text"
                                    placeholder="Link ou endereço"
                                >
                            </div>
                        </div>

                        <div class="textarea-wrapper">
                            <label for="description">Descrição</label>
                            <textarea 
                                name="description" 
                                id="description" 
                                cols="60"
                                rows="6"
                                placeholder="Escreva sobre os detalhes do evento"
                            ></textarea>
                        </div>
                    </fieldset>

                    <fieldset class="personalization">
                        <div class="legend">
                            <img src="assets/icons/paintbrush-vertical.svg" alt="ícone de pincel">
                            <legend>Personalização</legend>
                        </div>

                        <div class="input-wrapper">
                            <label>Cor principal</label>

                            <div class="color-wrapper">
                                <div class="color-inner">
                                    <div class="color-holder">
                                        <div class="color-circle blue-bg"></div>
                                    </div>
                                    <input type="radio" name="color" id="blue" value="blue" checked>
                                </div>

                                <div class="color-inner">
                                    <div class="color-holder">
                                        <div class="color-circle navy-bg"></div>
                                    </div>
                                    <input type="radio" name="color" id="navy" value="navy">
                                </div>

                                <div class="color-inner">
                                    <div class="color-holder">
                                        <div class="color-circle purple-bg"></div>
                                    </div>
                                    <input type="radio" name="color" id="purple" value="purple">
                                </div>

                                <div class="color-inner">
                                    <div class="color-holder">
                                        <div class="color-circle fuschia-bg"></div>
                                    </div>
                                    <input type="radio" name="color" id="fuschia" value="fuschia">
                                </div>
                                
                                <div class="color-inner">
                                    <div class="color-holder">
                                        <div class="color-circle pink-bg"></div>
                                    </div>
                                    <input type="radio" name="color" id="pink" value="pink">
                                </div>

                                <div class="color-inner">
                                    <div class="color-holder">
                                        <div class="color-circle red-bg"></div>
                                    </div>
                                    <input type="radio" name="color" id="red" value="red">
                                </div>

                                <div class="color-inner">
                                    <div class="color-holder">
                                        <div class="color-circle orange-bg"></div>
                                    </div>
                                    <input type="radio" name="color" id="orange" value="orange">
                                </div>

                                <div class="color-inner">
                                    <div class="color-holder">
                                        <div class="color-circle yellow-bg"></div>
                                    </div>
                                    <input type="radio" name="color" id="yellow" value="yellow">
                                </div>

                                <div class="color-inner">
                                    <div class="color-holder">
                                        <div class="color-circle lime-bg"></div>
                                    </div>
                                    <input type="radio" name="color" id="lime" value="lime">
                                </div>

                                <div class="color-inner">
                                    <div class="color-holder">
                                        <div class="color-circle green-bg"></div>
                                    </div>
                                    <input type="radio" name="color" id="green" value="green">
                                </div>

                                <div class="color-inner">
                                    <div class="color-holder">
                                        <div class="color-circle cyan-bg"></div>
                                    </div>
                                    <input type="radio" name="color" id="cyan" value="cyan">
                                </div>
                            </div>
                        </div>

                        <div class="input-wrapper">
                            <label>Tema do evento</label>

                            <div class="theme-wrapper">
                                <div class="theme-inner">
                                    <img src="assets/theme-images/aniversario.svg" alt="imagem bolo de aniversario">
                                    <input 
                                        type="radio" 
                                        name="theme" 
                                        id="birthday" 
                                        value="birthday"
                                    >
                                    <label for="birthday">Aniversário</label>
                                </div>

                                <div class="theme-inner">
                                    <img src="assets/theme-images/infantil.svg" alt="imagem de festa de criança">
                                    <input 
                                        type="radio" 
                                        name="theme" 
                                        id="child" 
                                        value="child"
                                    >
                                    <label for="child">Infantil</label>
                                </div>

                                <div class="theme-inner">
                                    <img src="assets/theme-images/formatura.svg" alt="imagem de formatura">
                                    <input 
                                        type="radio" 
                                        name="theme" 
                                        id="graduation" 
                                        value="graduation"
                                    >
                                    <label for="graduation">Formatura</label>
                                </div>

                                <div class="theme-inner">
                                    <img src="assets/theme-images/casamento.svg" alt="imagem de aneis de casamento">
                                    <input 
                                        type="radio" 
                                        name="theme" 
                                        id="wedding" 
                                        value="wedding"
                                    >
                                    <label for="wedding">Casamento</label>
                                </div>

                                <div class="theme-inner">
                                    <img src="assets/theme-images/chá-bebe.svg" alt="imagem de chá de bebê">
                                    <input 
                                        type="radio" 
                                        name="theme" 
                                        id="baby-shower" 
                                        value="baby-shower "
                                    >
                                    <label for="baby-shower">Chá de bebê</label>
                                </div>

                                <div class="theme-inner">
                                    <img src="assets/theme-images/chá-panela.svg" alt="imagem de uma cozinha">
                                    <input 
                                        type="radio" 
                                        name="theme" 
                                        id="new-house" 
                                        value="new-house"
                                    >
                                    <label for="new-house">Chá de panela</label>
                                </div>

                                <div class="theme-inner">
                                    <img src="assets/theme-images/carnaval.svg" alt="imagem de folia">
                                    <input 
                                        type="radio" 
                                        name="theme" 
                                        id="carnaval" 
                                        value="carnaval"
                                    >
                                    <label for="carnaval">Carnaval</label>
                                </div>

                                <div class="theme-inner">
                                    <img src="assets/theme-images/pascoa.svg" alt="imagem de ovos de pascoa">
                                    <input 
                                        type="radio" 
                                        name="theme" 
                                        id="easter" 
                                        value="easter"
                                    >
                                    <label for="easter">Páscoa</label>
                                </div>

                                <div class="theme-inner">
                                    <img src="assets/theme-images/sao-joao.svg" alt="imagem de bandeiras de são joão penduradas">
                                    <input 
                                        type="radio" 
                                        name="theme" 
                                        id="june-festival" 
                                        value="june-festival"
                                    >
                                    <label for="june-festival">São João</label>
                                </div>

                                <div class="theme-inner">
                                    <img src="assets/theme-images/halloween.svg" alt="imagem de aboboras de halloween">
                                    <input 
                                        type="radio" 
                                        name="theme" 
                                        id="halloween" 
                                        value="halloween"
                                    >
                                    <label for="halloween">Halloween</label>
                                </div>

                                <div class="theme-inner">
                                    <img src="assets/theme-images/natal.svg" alt="imagem de presentes de natal">
                                    <input 
                                        type="radio" 
                                        name="theme" 
                                        id="christmas" 
                                        value="christmas"
                                    >
                                    <label for="christmas">Natal</label>
                                </div>

                                <div class="theme-inner">
                                    <img src="assets/theme-images/outro.svg" alt="imagem de pessoas com taças levantadas">
                                    <input 
                                        type="radio" 
                                        name="theme" 
                                        id="other" 
                                        value="other"
                                    >
                                    <label for="other">Outro</label>
                                </div>
                            </div>
                        </div>

                        <div class="separation-wrapper">
                            <div>
                                <label for="switch-input">Estilo</label>
                                <div class="switch-holder">
                                    <div class="switch">
                                        <input type="checkbox" id="switch-input" name="switch-input">
                                        <span class="slider"></span>
                                    </div>
                                    <div>
                                        <p id="dark-theme">Escuro</p>
                                        <p id="light-theme">Claro</p>
                                    </div>
                                </div>
                            </div>

                            <div class="droparea-wrapper">
                                <label for="cover-photo">Foto de capa</label>
                                <div class="droparea">
                                    <div class="dropzone">
                                        <img src="assets/icons/upload.svg" alt="ícone de upload">
                                        <input 
                                            type="file"
                                            id="cover-photo"
                                            name="cover-photo"
                                        >
                                        <p>Selecionar</p>
                                    </div>
                                    <span>Nenhum arquivo selecionado</span>
                                </div>
                            </div>
                        </div>
                    </fieldset>

                    <fieldset class="contact-data">
                        <div class="legend">
                            <img src="assets/icons/contact.svg" alt="ícone de rosto de pessoa">
                            <legend>Dados para contato</legend>
                        </div>

                        <div class="input-wrapper">
                            <label for="name">Nome</label>
                            <input type="text" id="name" name="name" placeholder="Nome Completo" required>
                            <div class="error">
                                <img src="assets/icons/circle-alert.svg" alt="ícone de alerta">
                                <span>Campo obrigatório</span>
                            </div>
                        </div>

                        <div class="grid">
                            <div class="input-wrapper">
                                <label for="email">E-mail</label>
                                <input type="email" id="email" name="email" placeholder="exemplo@email.com">
                            </div>

                            <div class="input-wrapper">
                                <label for="telephone">Telefone</label>
                                <input type="text" id="telephone" name="telephone" placeholder="(99) 99999-9999">
                            </div>
                        </div>
                    </fieldset>

                    <fieldset class="footer">
                        <div class="border"></div>

                        <div class="terms-wrapper">
                            <div class="input-wrapper flex checkbox-wrapper">
                                <div class="checkbox-image"></div>
                                <input type="checkbox" name="terms" id="terms">
                                <label for="terms">Li e concordo com os <a href="#">Termos e Condições</a> e com a <a href="#">Política de Privacidade</a></label>
                            </div>

                            <div class="input-wrapper flex checkbox-wrapper">
                                <div class="checkbox-image"></div>
                                <input type="checkbox" name="update-email" id="update-email">
                                <label for="update-email">Aceito receber atualizações e promoções por e-mail</label>
                            </div>

                            <div class="input-wrapper flex checkbox-wrapper">
                                <div class="checkbox-image"></div>
                                <input type="checkbox" name="update-sms" id="update-sms">
                                <label for="update-sms">Aceito receber atualizaçõese promoções por SMS</label>
                            </div>
                        </div>

                        <div class="actions-wrapper">
                            <button type="button">
                                <img src="assets/icons/ticket.svg" alt="ícone de ticket">
                                <p>Gerar convite</p>
                            </button>
                        </div>
                    </fieldset>
                </form>
            </div>
        </main>
    </div>
</body>

</html>
