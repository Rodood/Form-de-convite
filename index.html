<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festivite</title>
    <link rel="stylesheet" href="styles/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Leckerli+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id=app>
        <aside>
            <img src="assets/icons/Logo.svg" alt="ícone de lança confete">
            <h1>Festivite</h1>
            <p>Crie um convite digital para o seu evento</p>
        </aside>

        <main>
            <div id="main-container">
                <h2>Crie seu convite</h2>
                <form method="post" enctype="multipart/form-data">
                    <fieldset class="about-event">
                        <div class="legend">
                            <img src="assets/icons/calendar.svg" alt="ícone de calendário">
                            <legend>Sobre o evento</legend>
                        </div>

                        <div class="input-wrapper">
                            <label for="event-name">Título</label>
                            <input 
                                id="event-name"
                                name="event-name"
                                type="text"
                                placeholder="Nome do evento"
                            >
                        </div>

                        <div class="grid">
                            <div class="input-wrapper">
                                <label for="event-begin">Início</label>
                                <input 
                                    id="event-begin"
                                    name="event-begin"
                                    type="datetime-local"
                                >
                            </div>

                            <div class="input-wrapper">
                                <label for="event-end">Fim</label>
                                <input 
                                    id="event-end"
                                    name="event-end"
                                    type="datetime-local"
                                >
                            </div>

                            <div>
                                <label>Tipo</label>

                                <div class="type-wrapper">
                                    <div class="type-inner">
                                        <div class="in-person-image"></div>
                                        <input 
                                        id="in-person"
                                        name="type"
                                        value="in-person"
                                        type="radio"
                                        checked
                                        >
                                        <label for="in-person">Presencial</label>
                                    </div>

                                    <div class="type-inner">
                                        <div class="remote-image"></div>
                                        <input 
                                        id="remote"
                                        name="type"
                                        value="remote"
                                        type="radio"
                                        >
                                        <label for="remote">Remoto</label>
                                    </div>
                                </div>
                            </div>

                            <div class="input-wrapper">
                                <label for="local">Local</label>
                                <input 
                                    id="local"
                                    name="local"
                                    type="text"
                                    placeholder="Link ou endereço"
                                >
                            </div>
                        </div>

                        <div class="textarea-wrapper">
                            <label for="description">Descrição</label>
                            <textarea 
                                name="description" 
                                id="description" 
                                cols="60"
                                rows="6"
                                placeholder="Escreva sobre os detalhes do evento"
                            ></textarea>
                        </div>
                    </fieldset>

                    <fieldset class="personalization">
                        <div class="legend">
                            <img src="assets/icons/paintbrush-vertical.svg" alt="ícone de pincel">
                            <legend>Personalização</legend>
                        </div>

                        <div class="input-wrapper">
                            <label>Cor principal</label>

                            <div class="color-wrapper">
                                <div class="color-inner">
                                    <div class="color-holder">
                                        <div class="color-circle"></div>
                                    </div>
                                    <input type="radio" name="color" id="cyan" value="cyan">
                                </div>

                                <div class="color-inner">
                                    <div class="color-holder">
                                        <div class="color-circle"></div>
                                    </div>
                                    <input type="radio" name="color" id="cyan" value="cyan">
                                </div>

                                <div class="color-inner">
                                    <div class="color-holder">
                                        <div class="color-circle"></div>
                                    </div>
                                    <input type="radio" name="color" id="cyan" value="cyan">
                                </div>

                                <div class="color-inner">
                                    <div class="color-holder">
                                        <div class="color-circle"></div>
                                    </div>
                                    <input type="radio" name="color" id="cyan" value="cyan">
                                </div>
                                
                                <div class="color-inner">
                                    <div class="color-holder">
                                        <div class="color-circle"></div>
                                    </div>
                                    <input type="radio" name="color" id="cyan" value="cyan">
                                </div>

                                <div class="color-inner">
                                    <div class="color-holder">
                                        <div class="color-circle"></div>
                                    </div>
                                    <input type="radio" name="color" id="cyan" value="cyan">
                                </div>

                                <div class="color-inner">
                                    <div class="color-holder">
                                        <div class="color-circle"></div>
                                    </div>
                                    <input type="radio" name="color" id="cyan" value="cyan">
                                </div>

                                <div class="color-inner">
                                    <div class="color-holder">
                                        <div class="color-circle"></div>
                                    </div>
                                    <input type="radio" name="color" id="cyan" value="cyan">
                                </div>

                                <div class="color-inner">
                                    <div class="color-holder">
                                        <div class="color-circle"></div>
                                    </div>
                                    <input type="radio" name="color" id="cyan" value="cyan">
                                </div>

                                <div class="color-inner">
                                    <div class="color-holder">
                                        <div class="color-circle"></div>
                                    </div>
                                    <input type="radio" name="color" id="cyan" value="cyan">
                                </div>

                                <div class="color-inner">
                                    <div class="color-holder">
                                        <div class="color-circle"></div>
                                    </div>
                                    <input type="radio" name="color" id="cyan" value="cyan">
                                </div>
                            </div>
                        </div>

                        <div class="input-wrapper">
                            <label>Tema do evento</label>

                            <div class="theme-wrapper">
                                <div class="theme-inner">
                                    <img src="" alt="">
                                    <input 
                                        type="radio" 
                                        name="theme" 
                                        id="birthday" 
                                        value="birthday"
                                    >
                                    <label for="birthday">Aniversário</label>
                                </div>

                                <div class="theme-inner">
                                    <img src="" alt="">
                                    <input 
                                        type="radio" 
                                        name="theme" 
                                        id="child" 
                                        value="child"
                                    >
                                    <label for="child">Infantil</label>
                                </div>

                                <div class="theme-inner">
                                    <img src="" alt="">
                                    <input 
                                        type="radio" 
                                        name="theme" 
                                        id="graduation" 
                                        value="graduation"
                                    >
                                    <label for="graduation">Formatura</label>
                                </div>

                                <div class="theme-inner">
                                    <img src="" alt="">
                                    <input 
                                        type="radio" 
                                        name="theme" 
                                        id="wedding" 
                                        value="wedding"
                                    >
                                    <label for="wedding">Casamento</label>
                                </div>

                                <div class="theme-inner">
                                    <img src="" alt="">
                                    <input 
                                        type="radio" 
                                        name="theme" 
                                        id="baby-shower" 
                                        value="baby-shower "
                                    >
                                    <label for="baby-shower">Chá de bebê</label>
                                </div>

                                <div class="theme-inner">
                                    <img src="" alt="">
                                    <input 
                                        type="radio" 
                                        name="theme" 
                                        id="new-house" 
                                        value="new-house"
                                    >
                                    <label for="new-house">Chá de panela</label>
                                </div>

                                <div class="theme-inner">
                                    <img src="" alt="">
                                    <input 
                                        type="radio" 
                                        name="theme" 
                                        id="carnaval" 
                                        value="carnaval"
                                    >
                                    <label for="carnaval">Carnaval</label>
                                </div>

                                <div class="theme-inner">
                                    <img src="" alt="">
                                    <input 
                                        type="radio" 
                                        name="theme" 
                                        id="easter" 
                                        value="easter"
                                    >
                                    <label for="easter">Páscoa</label>
                                </div>

                                <div class="theme-inner">
                                    <img src="" alt="">
                                    <input 
                                        type="radio" 
                                        name="theme" 
                                        id="june-festival" 
                                        value="june-festival"
                                    >
                                    <label for="june-festival">São João</label>
                                </div>

                                <div class="theme-inner">
                                    <img src="" alt="">
                                    <input 
                                        type="radio" 
                                        name="theme" 
                                        id="halloween" 
                                        value="halloween"
                                    >
                                    <label for="halloween">Halloween</label>
                                </div>

                                <div class="theme-inner">
                                    <img src="" alt="">
                                    <input 
                                        type="radio" 
                                        name="theme" 
                                        id="christmas" 
                                        value="christmas"
                                    >
                                    <label for="christmas">Natal</label>
                                </div>

                                <div class="theme-inner">
                                    <img src="" alt="">
                                    <input 
                                        type="radio" 
                                        name="theme" 
                                        id="other" 
                                        value="other"
                                    >
                                    <label for="other">Outro</label>
                                </div>
                            </div>
                        </div>

                        <div class="invitation">
                            <label class="switch">
                                Estilo
                                <input type="checkbox">
                                <span class="slider-round"></span>
                            </label>

                            <div class="droparea-wrapper">
                                <label for="cover-photo">Foto de capa</label>
                                <div class="dropzone">
                                    <input 
                                        type="file"
                                        id="cover-photo"
                                        name="cover-photo"
                                    >
                                </div>
                            </div>
                        </div>
                    </fieldset>
                </form>
            </div>
        </main>
    </div>
</body>

</html>
